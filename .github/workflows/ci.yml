name: Vyde CI & Build Pipeline

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Keep main APK builds running while follow-up commits queue; superseded PR
  # checks may be cancelled without discarding a device-test artifact build.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Typecheck & Workspace Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.16.1

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run production-module regression tests
        run: pnpm test

      - name: Typecheck libraries
        run: pnpm run typecheck:libs

      - name: Typecheck mobile app (@workspace/vyde)
        run: pnpm --filter @workspace/vyde run typecheck

      - name: Typecheck API server (@workspace/api-server)
        run: pnpm --filter @workspace/api-server run typecheck

      - name: Build API server
        run: pnpm --filter @workspace/api-server run build

  benchmark:
    name: InnerTube Extractor Benchmark
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run 15-Video Extractor Benchmark
        run: node scripts/benchmark_phase1.mjs
        continue-on-error: true

  build-mobile-preview:
    name: Build Mobile Web & Bundle Check
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.16.1

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Export Expo Web Bundle
        working-directory: artifacts/vyde
        run: pnpm exec expo export --platform web --output-dir dist-web

      - name: Export Android Hermes Bundle
        working-directory: artifacts/vyde
        run: pnpm exec expo export --platform android --output-dir dist-android

      - name: Upload Web Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vyde-web-preview
          path: artifacts/vyde/dist-web
          retention-days: 7

  android-build:
    name: Android ${{ matrix.variant }} APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: verify
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        variant: [debug, release]
    env:
      APK_VARIANT: ${{ matrix.variant }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.16.1

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check Release Babel Configuration
        working-directory: artifacts/vyde
        run: node -e "require('@babel/core').loadPartialConfig({ filename: require.resolve('expo-router/entry') }); console.log('Babel presets resolved')"

      - name: Prebuild Native Android Project
        working-directory: artifacts/vyde
        run: pnpm exec expo prebuild --platform android --no-install

      - name: Embed JavaScript in Sideload Debug APK
        if: matrix.variant == 'debug'
        run: |
          # React Native normally skips bundling for debug and requires Metro.
          # CI device-test APKs must carry their JavaScript bundle with them.
          cat >> artifacts/vyde/android/app/build.gradle <<'GRADLE'

          react {
              debuggableVariants = []
          }
          GRADLE

      - name: Configure Explicitly Unsigned Release
        if: matrix.variant == 'release'
        run: |
          # Expo's generated template signs release with its debug key by
          # default. Override that explicitly until release signing is chosen.
          cat >> artifacts/vyde/android/app/build.gradle <<'GRADLE'

          android {
              buildTypes {
                  release {
                      signingConfig null
                  }
              }
          }
          GRADLE

      - name: Build Debug APK
        if: matrix.variant == 'debug'
        working-directory: artifacts/vyde/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Build Unsigned Release APK
        if: matrix.variant == 'release'
        working-directory: artifacts/vyde/android
        run: ./gradlew assembleRelease --no-daemon

      - name: Verify APK Identity and Record Provenance
        env:
          EXPECTED_ANDROID_PACKAGE: com.vyde.android
        run: |
          python3 scripts/ci/verify_android_apk.py

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.variant == 'debug' && 'vyde-android-debug-apk' || 'vyde-android-release-unsigned-apk' }}
          path: |
            artifacts/vyde/android/app/build/outputs/apk/${{ matrix.variant }}/*.apk
            artifacts/vyde/android/app/build/outputs/apk/${{ matrix.variant }}/apk-provenance.json
          if-no-files-found: error
          retention-days: 14
