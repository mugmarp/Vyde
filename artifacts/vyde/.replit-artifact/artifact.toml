kind = "mobile"
previewPath = "/"
title = "Vyde"
version = "1.0.0"
id = "artifacts/vyde"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/" ]
localPort = 18086

[services.development]
run = "pnpm --filter @workspace/vyde run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/vyde", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/vyde", "run", "serve" ]

[services.env]
PORT = "18086"
BASE_PATH = "/"
