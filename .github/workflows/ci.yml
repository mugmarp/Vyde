name: Vyde CI & Build Pipeline

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Keep main APK builds running while follow-up commits queue; superseded PR
  # checks may be cancelled without discarding a device-test artifact build.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Typecheck & Workspace Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.16.1

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run production-module regression tests
        run: pnpm test

      - name: Typecheck libraries
        run: pnpm run typecheck:libs

      - name: Typecheck mobile app (@workspace/vyde)
        run: pnpm --filter @workspace/vyde run typecheck

      - name: Typecheck API server (@workspace/api-server)
        run: pnpm --filter @workspace/api-server run typecheck

      - name: Build API server
        run: pnpm --filter @workspace/api-server run build

  benchmark:
    name: InnerTube Extractor Benchmark
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run 15-Video Extractor Benchmark
        run: node scripts/benchmark_phase1.mjs
        continue-on-error: true

  build-mobile-preview:
    name: Build Mobile Web & Bundle Check
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.16.1

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Export Expo Web Bundle
        working-directory: artifacts/vyde
        run: pnpm exec expo export --platform web --output-dir dist-web

      - name: Export Android Hermes Bundle
        working-directory: artifacts/vyde
        run: pnpm exec expo export --platform android --output-dir dist-android

      - name: Upload Web Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vyde-web-preview
          path: artifacts/vyde/dist-web
          retention-days: 7

  android-build:
    name: Android ${{ matrix.variant }} APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: verify
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        variant: [debug, release]
    env:
      APK_VARIANT: ${{ matrix.variant }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.16.1

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prebuild Native Android Project
        working-directory: artifacts/vyde
        run: pnpm exec expo prebuild --platform android --no-install

      - name: Configure Explicitly Unsigned Release
        if: matrix.variant == 'release'
        run: |
          # Expo's generated template signs release with its debug key by
          # default. Override that explicitly until release signing is chosen.
          cat >> artifacts/vyde/android/app/build.gradle <<'GRADLE'

          android {
              buildTypes {
                  release {
                      signingConfig null
                  }
              }
          }
          GRADLE

      - name: Build Debug APK
        if: matrix.variant == 'debug'
        working-directory: artifacts/vyde/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Build Unsigned Release APK
        if: matrix.variant == 'release'
        working-directory: artifacts/vyde/android
        run: ./gradlew assembleRelease --no-daemon

      - name: Verify APK Identity and Record Provenance
        env:
          EXPECTED_ANDROID_PACKAGE: com.vyde.android
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, re, struct, subprocess, zipfile
          variant = os.environ['APK_VARIANT']
          apk_dir = pathlib.Path('artifacts/vyde/android/app/build/outputs/apk') / variant
          sdk = pathlib.Path(os.environ.get('ANDROID_HOME') or os.environ['ANDROID_SDK_ROOT'])
          tools = sorted((sdk / 'build-tools').glob('*/aapt'), key=lambda p: tuple(map(int, re.findall(r'\d+', p.parent.name))))
          if not tools:
              raise SystemExit('Android build tools not found')
          aapt = tools[-1]
          apks = sorted(apk_dir.glob('*.apk'))
          if not apks:
              raise SystemExit('No ' + variant + ' APK was produced')
          artifacts = []
          for apk in apks:
              badging = subprocess.run([str(aapt), 'dump', 'badging', str(apk)], check=True, capture_output=True, text=True).stdout
              package = next((line for line in badging.splitlines() if line.startswith('package:')), '')
              identity = dict(re.findall(r"(\w+)='([^']*)'", package))
              if identity.get('name') != os.environ['EXPECTED_ANDROID_PACKAGE']:
                  raise SystemExit('Unexpected Android package: ' + identity.get('name', 'missing'))
              debuggable = 'application-debuggable' in badging
              if debuggable != (variant == 'debug'):
                  raise SystemExit('Unexpected debuggable state for ' + variant)
              with zipfile.ZipFile(apk) as archive:
                  if archive.testzip() is not None:
                      raise SystemExit('APK ZIP integrity check failed')
                  v1_signatures = any(re.match(r'META-INF/[^/]+\.(RSA|DSA|EC)$', name, re.I) for name in archive.namelist())
              signing = subprocess.run([str(aapt.parent / 'apksigner'), 'verify', '--print-certs', str(apk)], capture_output=True, text=True)
              certificates = re.findall(r'Signer #\d+ certificate SHA-256 digest: ([0-9a-fA-F]+)', signing.stdout)
              if variant == 'debug':
                  if signing.returncode != 0 or not certificates:
                      raise SystemExit('Debug APK signing verification failed')
              else:
                  # Check the actual signing-block position, not arbitrary
                  # strings that might also appear inside an application asset.
                  with apk.open('rb') as binary:
                      binary.seek(max(0, apk.stat().st_size - 65557))
                      tail = binary.read()
                      eocd = tail.rfind(b'PK\x05\x06')
                      if eocd < 0:
                          raise SystemExit('Missing APK ZIP directory')
                      directory = struct.unpack_from('<I', tail, eocd + 16)[0]
                      if directory == 0xffffffff or directory < 16:
                          raise SystemExit('Unsupported APK ZIP directory')
                      binary.seek(directory - 16)
                      signing_block = binary.read(16) == b'APK Sig Block 42'
                  if signing.returncode == 0 or certificates or v1_signatures or signing_block:
                      raise SystemExit('Release must remain unsigned until signing is configured')
              with apk.open('rb') as binary:
                  digest = hashlib.file_digest(binary, 'sha256').hexdigest()
              artifacts.append({'file': apk.name, 'bytes': apk.stat().st_size, 'sha256': digest, 'package': identity['name'], 'versionName': identity.get('versionName'), 'versionCode': identity.get('versionCode'), 'debuggable': debuggable, 'signing': 'debug-key' if variant == 'debug' else 'unsigned', 'installable': variant == 'debug', 'signerCertificateSha256': certificates})
          provenance = {'variant': variant, 'sourceCommit': os.environ['GITHUB_SHA'], 'run': os.environ['GITHUB_SERVER_URL'] + '/' + os.environ['GITHUB_REPOSITORY'] + '/actions/runs/' + os.environ['GITHUB_RUN_ID'], 'artifacts': artifacts}
          (apk_dir / 'apk-provenance.json').write_text(json.dumps(provenance, indent=2) + '\n')
          print(json.dumps(provenance, indent=2))
          PY

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.variant == 'debug' && 'vyde-android-debug-apk' || 'vyde-android-release-unsigned-apk' }}
          path: |
            artifacts/vyde/android/app/build/outputs/apk/${{ matrix.variant }}/*.apk
            artifacts/vyde/android/app/build/outputs/apk/${{ matrix.variant }}/apk-provenance.json
          if-no-files-found: error
          retention-days: 14
