name: Vyde CI & Build Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck & Workspace Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Typecheck libraries
        run: pnpm run typecheck:libs

      - name: Typecheck mobile app (@workspace/vyde)
        run: pnpm --filter @workspace/vyde run typecheck

      - name: Typecheck API server (@workspace/api-server)
        run: pnpm --filter @workspace/api-server run typecheck

      - name: Build API server
        run: pnpm --filter @workspace/api-server run build

  build-mobile-preview:
    name: Build Mobile Web & Bundle Check
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Export Expo Web Bundle
        working-directory: artifacts/vyde
        run: npx expo export --platform web --output-dir dist-web

      - name: Upload Web Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vyde-web-preview
          path: artifacts/vyde/dist-web
          retention-days: 7

  android-build:
    name: Android Sideload / F-Droid APK Preparation
    runs-on: ubuntu-latest
    needs: verify
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Prebuild Native Android Project
        working-directory: artifacts/vyde
        run: npx expo prebuild --platform android --no-install

      - name: Build Android APK (Debug / Sideload)
        working-directory: artifacts/vyde/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: vyde-android-debug-apk
          path: artifacts/vyde/android/app/build/outputs/apk/debug/*.apk
          retention-days: 14
